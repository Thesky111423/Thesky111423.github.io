<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 神秘测试</title>
    <meta name="description" content="一个有趣的小测试">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 开始界面 -->
        <div class="intro-screen" id="introScreen">
            <div class="mystery-box">
                <div class="box-icon">🔮</div>
                <div class="box-glow"></div>
            </div>
            <h1 class="intro-title">神秘测试</h1>
            <p class="intro-text">想看看我们有多默契吗？</p>
            <p class="intro-hint">（放心，只是个无聊的小游戏 😏）</p>
            <button class="start-btn" id="startBtn">开始测试</button>
        </div>

        <!-- 测试问题 -->
        <div class="quiz-section hidden" id="quizSection">
            <div class="quiz-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">1 / 5</div>

                <div class="quiz-question" id="question1">
                    <div class="question-emoji">🤔</div>
                    <h3>我们是在哪里认识的？</h3>
                    <div class="options">
                        <button class="option-btn" data-correct="true">抖音评论</button>
                        <button class="option-btn">微信摇一摇</button>
                        <button class="option-btn">相亲角</button>
                        <button class="option-btn">梦里</button>
                    </div>
                </div>

                <div class="quiz-question hidden" id="question2">
                    <div class="question-emoji">📍</div>
                    <h3>我现在在哪个省？</h3>
                    <div class="options">
                        <button class="option-btn">河南</button>
                        <button class="option-btn" data-correct="true">湖北</button>
                        <button class="option-btn">河北</button>
                        <button class="option-btn">湖南</button>
                    </div>
                </div>

                <div class="quiz-question hidden" id="question3">
                    <div class="question-emoji">⏰</div>
                    <h3>我们认识多久了？</h3>
                    <div class="options">
                        <button class="option-btn">3天</button>
                        <button class="option-btn" data-correct="true">15天左右</button>
                        <button class="option-btn">半年</button>
                        <button class="option-btn">上辈子</button>
                    </div>
                </div>

                <div class="quiz-question hidden" id="question4">
                    <div class="question-emoji">🍜</div>
                    <h3>湖北最有名的小吃是？</h3>
                    <div class="options">
                        <button class="option-btn">热干面</button>
                        <button class="option-btn" data-correct="true">热干面</button>
                        <button class="option-btn">还是热干面</button>
                        <button class="option-btn">当然是热干面</button>
                    </div>
                </div>

                <div class="quiz-question hidden" id="question5">
                    <div class="question-emoji">😏</div>
                    <h3>最后一个问题：你觉得我是个怎样的人？</h3>
                    <div class="options">
                        <button class="option-btn" data-score="10">有趣的灵魂</button>
                        <button class="option-btn" data-score="8">有点意思</button>
                        <button class="option-btn" data-score="5">还行吧</button>
                        <button class="option-btn" data-score="15">超级完美（选这个有惊喜）</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 计算中 -->
        <div class="calculating hidden" id="calculating">
            <div class="calc-icon">🔮</div>
            <h2>正在计算默契度...</h2>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- 结果界面 -->
        <div class="result-section hidden" id="resultSection">
            <div class="result-container">
                <div class="result-emoji" id="resultEmoji">🎉</div>
                <h2 id="resultTitle">默契度测试结果</h2>
                <div class="score-display">
                    <span class="score-num" id="scoreNum">0</span>
                    <span class="score-label">%</span>
                </div>
                <p class="result-message" id="resultMessage">正在生成结果...</p>
                <div class="result-details" id="resultDetails"></div>
                <button class="retry-btn" id="retryBtn">再玩一次</button>
                <p class="result-hint" id="resultHint"></p>
            </div>
        </div>

        <!-- 恶作剧彩蛋 -->
        <div class="easter-egg hidden" id="easterEgg">
            <div class="egg-container">
                <div class="egg-icon">😂</div>
                <h2>哈哈被骗到了吧！</h2>
                <p>其实没有隐藏功能</p>
                <p>就是想看看你会不会点 😏</p>
                <div class="egg-hearts">
                    <span>💕</span>
                    <span>✨</span>
                    <span>💫</span>
                </div>
                <button class="back-btn" id="backBtn">返回结果</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
